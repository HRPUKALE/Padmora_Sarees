  <!-- Findings Callout -->
  <rect x="40" y="470" width="1120" height="240" rx="12" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="2"/>
  <text x="70" y="510" fill="#9F1239" font-size="18" font-weight="bold">AUDIT FINDINGS &amp; UX GAPS IDENTIFIED ON LIVE SITE:</text>
  <text x="70" y="545" fill="#334155" font-size="15">• Color variant fragmentation: The same design appears as 3 to 6 separate cards, cluttering the grid.</text><text x="70" y="579" fill="#334155" font-size="15">• Shopper scrolling fatigue: Buyers scroll past 15 sold-out cards before finding an in-stock piece.</text><text x="70" y="613" fill="#334155" font-size="15">• Spelling typos across live catalog: "Burgandy" (Burgundy), "Jhambul" (Jambhul), "Violate" (Violet).</text><text x="70" y="647" fill="#334155" font-size="15">• No filter grouping by occasion (Trousseau, Office, Festive) or instant "In Stock Only" toggle.</text><text x="70" y="681" fill="#334155" font-size="15">• Bag drawer occasional infinite loading freeze on checkout initiation.</text>
</svg>