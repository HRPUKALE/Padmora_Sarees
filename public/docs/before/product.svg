  <text x="70" y="545" fill="#334155" font-size="15">• Informal developer notes in live customer-facing description damages luxury handloom trust.</text><text x="70" y="579" fill="#334155" font-size="15">• Price justification missing: No fibre % (e.g. 50% Mulberry silk warp / 50% cotton weft) or loom provenance.</text><text x="70" y="613" fill="#334155" font-size="15">• Maheshwari Zari Checks priced at Rs 6,299 vs Rs 3,999 benchmark without stated value proposition.</text><text x="70" y="647" fill="#334155" font-size="15">• Zero on-woman drape photos or vertical 10s video reels showing fabric flow, pleats, and pallu weight.</text><text x="70" y="681" fill="#334155" font-size="15">• Missing direct WhatsApp consultation button for high-ticket handloom purchases.</text>
